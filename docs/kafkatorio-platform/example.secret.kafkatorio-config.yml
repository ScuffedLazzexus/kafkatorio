# Kafkatorio server config

jwt-secret: "correct horse battery staple"

# Define the servers that have the Kafkatorio Mod installed.
# The key is the server token: the 'sub' claim of the server's JWT (KAFKATORIO_TOKEN).
# The value is the server ID, used in URLs.
# Both may only contain letters, digits, '-' and '_'.
kafkatorio-servers:
  short-id-123: "short-id-123"
  another-id-456: "another-id-456"
