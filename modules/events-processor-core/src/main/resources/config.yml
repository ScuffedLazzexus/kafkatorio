# Factorio Events Processor config

web-port: ${WEB_SERVER_PORT:-8080}
server-data-dir: ${SERVER_DATA_DIR:-./server-data}


socket-server-host: ${SOCKET_SERVER_HOST:-0.0.0.0}
socket-server-port: ${SOCKET_SERVER_PORT:-12092}


kafka-admin-config:
  client.id: kafkatorio.events-server-admin
  bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}


kafka-streams-config:
  application.id: kafkatorio-events-processor
  bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
  state.dir: ${KAFKA_STREAMS_STATE_DIR:-.state/kafka}
  num.stream.threads: ${KAFKA_STREAMS_NUM_THREADS:-1}
  # With exactly_once_v2 the default commit interval is 100ms, so almost every intermediate
  # aggregate update is forwarded downstream. A longer interval and a larger record cache let
  # repeated updates to the same (large) map chunk be merged before being forwarded.
  commit.interval.ms: ${KAFKA_STREAMS_COMMIT_INTERVAL_MS:-100}
  cache.max.bytes.buffering: ${KAFKA_STREAMS_CACHE_MAX_BYTES:-10485760}
  # Under exactly_once_v2 Streams defaults the transaction timeout to 10s. It must be well above
  # commit.interval.ms, or transactions time out, get fenced, and the work is redone.
  producer.transaction.timeout.ms: ${KAFKA_STREAMS_TRANSACTION_TIMEOUT_MS:-60000}
  processing.guarantee: exactly_once_v2
  auto.offset.reset: earliest
  default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
  default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde

  #      default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

  #buffered.records.per.partition: 0
  #poll.ms: 10000

  # 31457280 :  30MB
  max.request.size: 31457280
  buffer.memory: 31457280

  compression.type: snappy
  # linger.ms=5

  # fetch.message.max.bytes=31457280
  # 100mb 104857600


