events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Sets the path, format, and configuration for a buffered log write
  #log_format compression '$remote_addr - $remote_user [$time_local] '
  #'"$request" $status $upstream_addr '
  #'"$http_referer" "$http_user_agent"';

  server {
    listen 80;

    root /usr/share/nginx/html;

    index index.html;

    # Docker's internal DNS - resolve the backend lazily, so nginx can start before it
    resolver 127.0.0.11 valid=10s;

    # proxy REST + WebSocket requests to events-server-web, so the map and the API share an origin
    location /kafkatorio/ {
      set $events_server_web http://events-server-web:80;
      proxy_pass $events_server_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location / {
      # First attempt to serve request as file, then
      # as directory, then fall back to redirecting to index.html
      try_files $uri $uri/ $uri.html /index.html;

      include       mime.types;
    }
  }
}
